[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "janvangen-reprotrace"
version = "0.1.0"
description = "记录提示词、参数、输入与环境快照，让同一次生成能被再次跑出来。"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "janvangen" }]
keywords = ["reproducibility", "provenance", "llm", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://janvangen.github.io"
Repository = "https://github.com/janvangen/reprotrace"
Issues = "https://github.com/janvangen/reprotrace/issues"

[project.scripts]
reprotrace = "reprotrace:main"

[tool.setuptools]
py-modules = ["reprotrace"]
